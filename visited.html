<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Visited Places - Screen To Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow-y: auto; background: #fdfbfb; }

  /* FOND ANIMÉ */
  .hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
  .blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
  .blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
  .blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }
  
  /* HEADER */
  .top-nav-standalone { position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 2000; background: transparent; }
  
  /* CONTENEUR PRINCIPAL */
  .standalone-container { padding-top: 120px; padding-bottom: 50px; max-width: 800px; margin: 0 auto; position: relative; z-index: 10; width: 90%; }
  .glass-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(80,60,120,.05); }
  
  .page-title { color: #D42759; margin-bottom: 30px; font-size: 28px; font-weight: 700; border-bottom: 2px solid #FCE7F0; padding-bottom: 15px; text-align: center;}
  .back-btn { display: inline-block; margin-bottom: 20px; color: #D42759; text-decoration: none; font-weight: bold; font-size: 13.5px; }
  .back-btn:hover { text-decoration: underline; }

  /* ÉLÉMENTS DE LA LISTE VISITED */
  .progress-section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
  .progress-item { margin-bottom: 15px; }
  .progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #212832; }
  .progress-bar-bg { width: 100%; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
  .progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

  .loc-card { display: flex; gap: 15px; background: #faf9fc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 12px; align-items: center; }
  .loc-card-thumb { width: 60px; height: 60px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; }
  .loc-card-info { flex: 1; }
  .loc-card-title { font-size: 15px; font-weight: 700; color: #212832; margin-bottom: 4px; }
  .loc-card-meta { font-size: 12px; color: #64748b; font-weight: 500; }
  .loc-card-date { font-size: 11px; background: #e2e8f0; padding: 4px 10px; border-radius: 100px; color: #475569; font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>

<div class="hero-background">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
</div>

<div class="top-nav-standalone">
    <a href="map.html" class="brand-row">
        <svg width="34" height="34" viewBox="0 0 400 400" style="flex-shrink:0;">
            <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
            <circle cx="200" cy="150" r="26" fill="#D42759"/>
        </svg>
        <div>
            <div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div>
            <div class="tagline">Following the footsteps of your favorite artists</div>
        </div>
    </a>
    
    <div class="header-actions">
        <div class="dropdown-container">
            <button class="header-icon-btn" onclick="window.location.href='map.html';">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            </button>
        </div>
        <div class="dropdown-container">
            <button class="header-icon-btn user-avatar-btn">U</button>
        </div>
    </div>
</div>

<div class="standalone-container">
    <div class="glass-card">
        <a href="map.html" class="back-btn">← Back to Map</a>
        <h1 class="page-title">My Visited Places</h1>
        
        <div id="visited-progress-container" class="progress-section"></div>
        <div id="visited-list-container"></div>
    </div>
</div>

<!-- Import script.js pour utiliser ses données -->
<script src="script.js"></script>
<script>
    window.addEventListener('load', () => {
        const visitedList = JSON.parse(localStorage.getItem('visitedLocs') || '[]');
        const progressContainer = document.getElementById('visited-progress-container');
        const listContainer = document.getElementById('visited-list-container');
        
        if (visitedList.length === 0) {
            progressContainer.style.display = 'none';
            listContainer.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:40px 0;">You haven\'t visited any places yet. Go explore the map!</p>';
            return;
        }

        // 1. Calculer les statistiques par groupe
        const groupStats = {};
        celebLocations.forEach(loc => {
            if(!groupStats[loc.group]) groupStats[loc.group] = { total: 0, visited: 0, color: groupColors[loc.group] || '#D42759' };
            groupStats[loc.group].total++;
        });

        visitedList.forEach(v => {
            const id = typeof v === 'object' ? v.id : v;
            const loc = celebLocations.find(l => l.id == id);
            if(loc && groupStats[loc.group]) groupStats[loc.group].visited++;
        });

        // 2. Afficher les barres de progression
        let progressHtml = '';
        for (let group in groupStats) {
            if (groupStats[group].visited > 0) {
                const perc = Math.round((groupStats[group].visited / groupStats[group].total) * 100);
                progressHtml += `
                    <div class="progress-item">
                        <div class="progress-header"><span>${group}</span> <span>${groupStats[group].visited}/${groupStats[group].total} (${perc}%)</span></div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${perc}%; background: ${groupStats[group].color};"></div></div>
                    </div>
                `;
            }
        }
        progressContainer.innerHTML = progressHtml;

        // 3. Afficher la liste des lieux visités
        let listHtml = '';
        visitedList.forEach(v => {
            const id = typeof v === 'object' ? v.id : v;
            const loc = celebLocations.find(l => l.id == id);
            if(loc) {
                const dateStr = v.date ? new Date(v.date).toLocaleDateString() : 'Unknown date';
                listHtml += `
                    <div class="loc-card">
                        <div class="loc-card-thumb" style="background-image:url('${loc.img}');"></div>
                        <div class="loc-card-info">
                            <div class="loc-card-title">${loc.name}</div>
                            <div class="loc-card-meta">${loc.group} · ${loc.city}, ${loc.country}</div>
                        </div>
                        <div class="loc-card-date">${dateStr}</div>
                    </div>
                `;
            }
        });
        listContainer.innerHTML = listHtml;
    });
</script>
</body>
</html>
