<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Screen To Street — My Visited Places</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;}
body{background:#E7E9EC;padding:0; height:100vh; overflow-x:hidden; overflow-y:auto;}
.hidden { display: none !important; }

/* FOND ANIMÉ */
.hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
.blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
.blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
.blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }

/* HEADER SEPARÉ POUR LE Z-INDEX (Le bloc passera SUR le logo mais SOUS les icônes) */
.universal-logo { position: fixed; top: 25px; left: 20px; z-index: 1000; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; }
.brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
.tagline { font-size: 12px; color: #5B6472; margin-top: 3px; line-height: 1.3;}

.universal-icons { position: fixed; top: 20px; right: 20px; z-index: 3000; display: flex; gap: 9px; align-items: center; }
.dropdown-container { position: relative; display: inline-block; }
.header-icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: 1px solid #cbd5e1; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.05); }
.header-icon-btn:hover { background: #FCE7F0; border-color: #fbcfe8; color: #D42759; transform: translateY(-2px);}
.user-avatar-btn { color: #000000 !important; overflow: hidden; padding: 0;}

.dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: block; text-align: left; text-decoration: none;}
.dropdown-option:hover { background: #f1f5f9; color: #D42759; }
.dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }

/* CENTRAGE ET Z-INDEX DU BLOC PRINCIPAL */
.page { position: relative; z-index: 2000; width: 100vw; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 120px 20px 80px 20px; pointer-events: none; }
.card { background: #fff; border-radius: 20px; padding: 45px 50px; width: 100%; max-width: 680px; box-shadow: 0 15px 40px rgba(80,60,120,.08); pointer-events: auto; }

.back-link { color: #D42759; font-weight: 700; font-size: 13.5px; display: inline-block; margin-bottom: 20px;}
.back-link:hover { text-decoration: underline; }
h1.pg-title { font-size: 26px; font-weight: 700; color: #D42759; text-align: center; margin: 0 0 30px 0; }

.progress-section { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; }
.progress-item { margin-bottom: 14px; }
.progress-header { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #212832; }
.progress-bar-bg { width: 100%; height: 8px; background: #f1f5f9; border-radius: 4px; overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }

.loc-card { display: flex; gap: 16px; background: #faf9fc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; align-items: center; cursor: pointer; transition: 0.2s;}
.loc-card:hover { border-color: #D42759; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(212,39,89,0.1); }
.loc-card-thumb { width: 64px; height: 64px; border-radius: 10px; background-size: cover; background-position: center; flex-shrink: 0; }
.loc-card-info { flex: 1; }
.loc-card-title { font-size: 15px; font-weight: 700; color: #212832; margin-bottom: 4px; }
.loc-card-meta { font-size: 12px; color: #64748b; font-weight: 500; }

/* CSS DU POPUP DES LIEUX */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); z-index: 9999; display: flex; justify-content: center; align-items: center; pointer-events: auto; }
.modal-box { background: white; width: 90%; max-width: 500px; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative;}
.modal-hero { height: 200px; background-size: cover; background-position: center; position: relative; }
.modal-close { position: absolute; top: 15px; right: 15px; width: 32px; height: 32px; background: rgba(0,0,0,0.5); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;}
.modal-close:hover { background: #D42759; }
.modal-hero-content { position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
.modal-hero-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.modal-hero-meta { font-size: 12px; font-weight: 600; opacity: 0.9; }
.modal-body { padding: 25px; }
.btn-outline-modal { display: block; text-align: center; border: 1.5px solid #cbd5e1; color: #334155; font-size: 13px; font-weight: 700; padding: 12px; border-radius: 100px; transition: 0.2s; }
.btn-outline-modal:hover { border-color: #D42759; color: #D42759; }
</style>
</head>
<body>

<div class="hero-background">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
</div>

<a href="map.html" class="universal-logo">
    <svg width="38" height="38" viewBox="0 0 400 400" style="flex-shrink:0;">
        <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
        <circle cx="200" cy="150" r="26" fill="#D42759"/>
    </svg>
    <div>
        <div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div>
        <div class="tagline">Following the footsteps of your favorite artists</div>
    </div>
</a>

<div class="universal-icons">
    <div class="dropdown-container">
        <button id="lang-btn" class="header-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
        <div id="lang-menu" class="dropdown-menu hidden">
            <a href="#" class="dropdown-option">English</a>
            <a href="#" class="dropdown-option">Français</a>
        </div>
    </div>
    <div class="dropdown-container">
        <button class="header-icon-btn" onclick="window.location.href='map.html';"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
    </div>
    <div class="dropdown-container">
        <button id="profile-btn" class="header-icon-btn user-avatar-btn">U</button>
        <div id="profile-menu" class="dropdown-menu hidden">
            <a href="map-destinations.html" class="dropdown-option">Explore Destinations</a>
            <a href="map-artists.html" class="dropdown-option">Explore Artists</a>
            <div class="dropdown-divider"></div>
            <a href="account.html" class="dropdown-option">Your Account</a>
            <a href="visited.html" class="dropdown-option" style="color: #D42759; font-weight: bold;">My Visited Places</a>
            <a href="wishlist.html" class="dropdown-option">My Wishlist</a>
            <a href="trips.html" class="dropdown-option">My Trips</a>
            <a href="settings.html" class="dropdown-option">Settings</a>
            <div class="dropdown-divider"></div>
            <a href="index.html" class="dropdown-option" style="color:#D42759; font-weight:bold;">Logout</a>
        </div>
    </div>
</div>

<div class="page">
    <div class="card">
      <a href="map.html" class="back-link">← Back to Map</a>
      <h1 class="pg-title">My Visited Places</h1>
      
      <div id="visited-progress-container" class="progress-section"></div>
      <div id="visited-list-container"></div>
    </div>
</div>

<!-- Modal Pop-up pour le détail des lieux -->
<div id="loc-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <div id="modal-hero" class="modal-hero">
            <div class="modal-close" onclick="closeLocModal()">&times;</div>
            <div class="modal-hero-content">
                <div id="modal-title" class="modal-hero-title">Location Name</div>
                <div id="modal-meta" class="modal-hero-meta">City, Country</div>
            </div>
        </div>
        <div class="modal-body">
            <p id="modal-desc" style="font-size: 13px; color: #3f495c; line-height: 1.7; margin-bottom: 20px;"></p>
            <a id="modal-map-link" href="#" target="_blank" class="btn-outline-modal">Open in Google Maps</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
<script>
    // Activation des menus déroulants
    ['lang-btn', 'profile-btn'].forEach(id => {
        const btn = document.getElementById(id);
        if(btn) btn.addEventListener('click', (e) => {
            const menuId = id.replace('-btn', '-menu');
            document.querySelectorAll('.dropdown-menu').forEach(m => { if(m.id !== menuId) m.classList.add('hidden'); });
            const targetMenu = document.getElementById(menuId);
            if(targetMenu) targetMenu.classList.toggle('hidden');
            e.stopPropagation();
        });
    });
    document.addEventListener('click', () => { document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden')); });

    const savedName = localStorage.getItem('userName') || 'User';
    const savedPic = localStorage.getItem('userPhoto');
    document.querySelectorAll('.user-avatar-btn').forEach(btn => {
        if(savedPic) { btn.innerHTML = `<img src="${savedPic}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`; } 
        else { btn.textContent = savedName.charAt(0).toUpperCase(); }
    });

    // Rendu Visited & Progress Bar
    window.addEventListener('load', () => {
        const visitedList = JSON.parse(localStorage.getItem('visitedLocs') || '[]');
        const progressContainer = document.getElementById('visited-progress-container');
        const listContainer = document.getElementById('visited-list-container');
        
        if (visitedList.length === 0) {
            progressContainer.innerHTML = '';
            listContainer.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:30px 0;">You haven\'t visited any places yet.</p>';
            return;
        }

        const groupStats = {};
        celebLocations.forEach(loc => {
            if(!groupStats[loc.group]) groupStats[loc.group] = { total: 0, visited: 0, color: groupColors[loc.group] || '#D42759' };
            groupStats[loc.group].total++;
        });

        visitedList.forEach(v => {
            const id = typeof v === 'object' ? v.id : v;
            const loc = celebLocations.find(l => l.id == id);
            if(loc && groupStats[loc.group]) groupStats[loc.group].visited++;
        });

        let progressHtml = '<div style="font-size:11px; font-weight:700; color:#94a3b8; text-transform:uppercase; margin-bottom:12px;">Group Progress</div>';
        for (let group in groupStats) {
            if (groupStats[group].visited > 0) {
                const perc = Math.round((groupStats[group].visited / groupStats[group].total) * 100);
                progressHtml += `
                    <div class="progress-item">
                        <div class="progress-header"><span>${group}</span> <span>${groupStats[group].visited}/${groupStats[group].total} (${perc}%)</span></div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${perc}%; background: ${groupStats[group].color};"></div></div>
                    </div>
                `;
            }
        }
        progressContainer.innerHTML = progressHtml;

        let listHtml = '';
        visitedList.forEach(v => {
            const id = typeof v === 'object' ? v.id : v;
            const loc = celebLocations.find(l => l.id == id);
            if(loc) {
                listHtml += `
                    <div class="loc-card" onclick="openLocModal(${loc.id})">
                        <div class="loc-card-thumb" style="background-image:url('${loc.img}');"></div>
                        <div class="loc-card-info">
                            <div class="loc-card-title">${loc.name}</div>
                            <div class="loc-card-meta">${loc.group} · ${loc.city}, ${loc.country}</div>
                        </div>
                    </div>
                `;
            }
        });
        listContainer.innerHTML = listHtml;
    });

    // Fonctions Modale
    function openLocModal(id) {
        const loc = celebLocations.find(l => l.id == id);
        if(!loc) return;
        document.getElementById('modal-title').textContent = loc.name;
        document.getElementById('modal-meta').textContent = `${loc.city}, ${loc.country} • ${loc.category}`;
        document.getElementById('modal-hero').style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.8), transparent), url('${loc.img}')`;
        const desc = loc.fullDescription ? (loc.fullDescription.en || "") : "";
        document.getElementById('modal-desc').innerHTML = desc;
        document.getElementById('modal-map-link').href = `https://www.google.com/maps/search/?api=1&query=${loc.lat},${loc.lng}`;
        document.getElementById('loc-modal').classList.remove('hidden');
    }
    function closeLocModal() {
        document.getElementById('loc-modal').classList.add('hidden');
    }
</script>
</body>
</html>
