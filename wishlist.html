<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Screen To Street</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #cbd5e1; }
        h1 { color: #D94680; text-align: center; border-bottom: 2px solid #FCE7F0; padding-bottom: 15px; margin-bottom: 30px;}
        a.back-btn { display: inline-block; margin-bottom: 20px; color: #D94680; text-decoration: none; font-weight: bold; }
        a.back-btn:hover { text-decoration: underline; }
        
        .wishlist-list { list-style: none; padding: 0; }
        .wishlist-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #f1f5f9; }
        .wishlist-item:last-child { border-bottom: none; }
        .loc-name { font-weight: bold; color: #334e68; font-size: 1.1rem;}
        .loc-group { font-size: 0.8rem; color: #64748b; text-transform: uppercase; font-weight: bold;}
        .loc-date { font-size: 0.85rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <a href="map.html" class="back-btn">← Back to Map</a>
        <h1>⭐ My Wishlist</h1>
        
        <ul id="wishlist-list" class="wishlist-list">
            <!-- La liste s'affichera ici -->
        </ul>
    </div>

    <script src="script.js"></script>
    <script>
        setTimeout(() => {
            let wishlistData = JSON.parse(localStorage.getItem('wishlistLocs') || '[]');
            wishlistData = wishlistData.map(w => typeof w === 'number' ? {id: w, date: "Added recently"} : w);

            const listContainer = document.getElementById('wishlist-list');

            if(wishlistData.length === 0) {
                listContainer.innerHTML = "<p style='color:#64748b; text-align:center;'>Your wishlist is empty.</p>";
            } else {
                wishlistData.forEach(w => {
                    const loc = celebLocations.find(l => l.id === w.id);
                    if(loc) {
                        listContainer.innerHTML += `
                            <li class="wishlist-item">
                                <div>
                                    <div class="loc-name">${loc.name}</div>
                                    <div class="loc-group">${loc.group} • ${loc.city}</div>
                                </div>
                                <div class="loc-date">Added: ${w.date}</div>
                            </li>
                        `;
                    }
                });
            }
        }, 100);
    </script>
</body>
</html>
