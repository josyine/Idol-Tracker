<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wishlist - Screen To Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;}
a{text-decoration:none;}
body{background:#E7E9EC;padding:0; height:100vh; overflow-x:hidden; overflow-y:auto;}
.hidden { display: none !important; }

.hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
@keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
.blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
.blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
.blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }

.universal-logo { position: fixed; top: 25px; left: 20px; z-index: 2000; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
.tagline { font-size: 12px; color: #5B6472; margin-top: 3px; line-height: 1.3;}

.universal-icons { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; gap: 9px; align-items: center; }
.dropdown-container { position: relative; display: inline-block; }
.header-icon-btn { width: 40px; height: 40px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: none; cursor: pointer; transition: 0.2s; font-size: 14px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.1); }
.header-icon-btn:hover { background: #f1f5f9; color: #D42759; }
.user-avatar-btn { color: #000 !important; overflow: hidden; padding: 0; border: 1px solid #cbd5e1; }

.dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 3000; }
.dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: block; text-align: left; text-decoration: none;}
.dropdown-option:hover { background: #f1f5f9; color: #D42759; }
.dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }

.page { position: relative; z-index: 10; width: 100vw; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 120px 20px 80px 20px; }
.card { background: #fff; border-radius: 20px; padding: 45px 50px; width: 100%; max-width: 800px; box-shadow: 0 15px 40px rgba(80,60,120,.08); margin: 0 auto; }

.back-link { color: #D42759; font-weight: 700; font-size: 13.5px; display: inline-block; margin-bottom: 20px;}
.back-link:hover { text-decoration: underline; }
h1.pg-title { font-size: 28px; font-weight: 700; color: #D42759; text-align: center; margin: 0 0 30px 0; }

.loc-card { display: flex; gap: 16px; background: #faf9fc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; align-items: center; }
.loc-card-thumb { width: 70px; height: 70px; border-radius: 10px; background-size: cover; background-position: center; flex-shrink: 0; }
.loc-card-info { flex: 1; }
.loc-card-title { font-size: 15px; font-weight: 700; color: #212832; margin-bottom: 4px; }
.loc-card-meta { font-size: 12.5px; color: #64748b; font-weight: 500; }
.remove-btn { background: #fee2e2; color: #ef4444; border: none; padding: 10px 16px; border-radius: 8px; font-size: 12.5px; font-weight: bold; cursor: pointer; transition: 0.2s;}
.remove-btn:hover { background: #ef4444; color: white; }
</style>
</head>
<body>

<div class="hero-background">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
</div>

<a href="map.html" class="universal-logo">
    <svg width="38" height="38" viewBox="0 0 400 400" style="flex-shrink:0;">
        <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
        <circle cx="200" cy="150" r="26" fill="#D42759"/>
    </svg>
    <div>
        <div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div>
        <div class="tagline">Following the footsteps of your favorite artists</div>
    </div>
</a>

<div class="universal-icons">
    <div class="dropdown-container">
        <button id="lang-btn" class="header-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
        <div id="lang-menu" class="dropdown-menu hidden">
            <a href="#" class="dropdown-option">English</a>
            <a href="#" class="dropdown-option">Français</a>
        </div>
    </div>
    <div class="dropdown-container">
        <button class="header-icon-btn" onclick="window.location.href='map.html';"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
    </div>
    <div class="dropdown-container">
        <button id="profile-btn" class="header-icon-btn user-avatar-btn">U</button>
        <div id="profile-menu" class="dropdown-menu hidden">
            <a href="map-destinations.html" class="dropdown-option">Explore Destinations</a>
            <a href="map-artists.html" class="dropdown-option">Explore Artists</a>
            <div class="dropdown-divider"></div>
            <a href="account.html" class="dropdown-option">Your Account</a>
            <a href="visited.html" class="dropdown-option">My Visited Places</a>
            <a href="wishlist.html" class="dropdown-option" style="color: #D42759; font-weight: bold;">My Wishlist</a>
            <a href="trips.html" class="dropdown-option">My Trips</a>
            <a href="settings.html" class="dropdown-option">Settings</a>
            <div class="dropdown-divider"></div>
            <a href="index.html" class="dropdown-option" style="color:#D42759; font-weight:bold;">Logout</a>
        </div>
    </div>
</div>

<div class="page">
    <div class="card">
      <a href="map.html" class="back-link">← Back to Map</a>
      <h1 class="pg-title">My Wishlist</h1>
      <div id="wishlist-container"></div>
    </div>
</div>

<script src="script.js"></script>
<script>
    // Initialisation des icônes
    const savedName = localStorage.getItem('userName') || 'User';
    const savedPic = localStorage.getItem('userPhoto');
    document.querySelectorAll('.user-avatar-btn').forEach(btn => {
        if(savedPic) {
            btn.innerHTML = `<img src="${savedPic}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        } else {
            btn.textContent = savedName.charAt(0).toUpperCase();
        }
    });

    ['lang-btn', 'profile-btn'].forEach(id => {
        const btn = document.getElementById(id);
        if(btn) btn.addEventListener('click', (e) => {
            const menuId = id.replace('-btn', '-menu');
            document.querySelectorAll('.dropdown-menu').forEach(m => { if(m.id !== menuId) m.classList.add('hidden'); });
            const targetMenu = document.getElementById(menuId);
            if(targetMenu) targetMenu.classList.toggle('hidden');
            e.stopPropagation();
        });
    });
    document.addEventListener('click', () => { document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.add('hidden')); });

    // Logique Wishlist
    window.addEventListener('load', () => {
        renderWishlist();
    });

    function renderWishlist() {
        const wList = JSON.parse(localStorage.getItem('wishlistLocs') || '[]');
        const container = document.getElementById('wishlist-container');
        
        if (wList.length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:40px 0; font-size: 14px;">Your wishlist is empty.</p>';
            return;
        }

        let html = '';
        wList.forEach(w => {
            const loc = celebLocations.find(l => l.id == w.id);
            if(loc) {
                html += `
                    <div class="loc-card">
                        <div class="loc-card-thumb" style="background-image:url('${loc.img}');"></div>
                        <div class="loc-card-info">
                            <div class="loc-card-title">${loc.name}</div>
                            <div class="loc-card-meta">${loc.group} · ${loc.city}, ${loc.country}</div>
                        </div>
                        <button class="remove-btn" onclick="removeWishlist(${loc.id})">Remove</button>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
    }

    function removeWishlist(id) {
        let wList = JSON.parse(localStorage.getItem('wishlistLocs') || '[]');
        wList = wList.filter(w => w.id != id);
        localStorage.setItem('wishlistLocs', JSON.stringify(wList));
        renderWishlist();
    }
</script>
</body>
</html>
