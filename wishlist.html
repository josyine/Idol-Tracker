<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen To Street — My Wishlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow-y: auto; background: #fdfbfb; }

  /* FOND ANIMÉ */
  .hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
  .blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
  .blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
  .blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }
  .bg-route { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.5; }
  .route-line { stroke-dasharray: 1 12; animation: flow 14s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -260; } }

  /* HEADER UNIVERSEL */
  .top-nav-standalone { position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 20px; z-index: 2000; background: transparent; }
  .header-left { width: 360px; display: flex; align-items: center; padding-top: 5px; }
  .brand-row { text-decoration: none; display: flex; align-items: center; cursor: pointer; gap: 12px; }
  .brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
  .tagline { font-size: 12px; color: #5B6472; margin-top: 3px; line-height: 1.3;}
  
  .header-right { display: flex; align-items: center; gap: 14px; }
  .dropdown-container { position: relative; display: inline-block; }
  .header-icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: 1px solid #cbd5e1; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.05); }
  .header-icon-btn:hover { background: #FCE7F0; border-color: #fbcfe8; color: #D42759; transform: translateY(-2px);}
  .user-avatar-btn { color: #000000 !important; overflow: hidden; padding: 0;}

  .dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 3000; }
  .dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: block; text-align: left; text-decoration: none;}
  .dropdown-option:hover { background: #f1f5f9; color: #D42759; }
  .dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }

  /* CONTENEUR PRINCIPAL */
  .page { padding: 120px 20px 80px 20px; max-width: 700px; margin: 0 auto; position: relative; z-index: 10; }
  .card { background: #fff; border-radius: 20px; padding: 38px 40px; box-shadow: 0 10px 30px rgba(80,60,120,.05); }
  
  .back-link { color: #D42759; font-weight: 700; font-size: 13px; }
  .back-link:hover { text-decoration: underline; }
  h1.pg-title { font-size: 24px; font-weight: 700; color: #D42759; text-align: center; margin: 14px 0 25px 0; }

  .loc-card { display: flex; gap: 15px; background: #faf9fc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 15px; margin-bottom: 12px; align-items: center; }
  .loc-card-thumb { width: 60px; height: 60px; border-radius: 8px; background-size: cover; background-position: center; flex-shrink: 0; }
  .loc-card-info { flex: 1; }
  .loc-card-title { font-size: 14px; font-weight: 700; color: #212832; margin-bottom: 4px; }
  .loc-card-meta { font-size: 11.5px; color: #64748b; font-weight: 500; }
  .remove-btn { background: #fee2e2; color: #ef4444; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s;}
  .remove-btn:hover { background: #ef4444; color: white; }
</style>
<script>
    if (!sessionStorage.getItem('bgSyncTime')) { sessionStorage.setItem('bgSyncTime', Date.now()); }
    document.documentElement.style.setProperty('--sync-t', ((Date.now() - parseInt(sessionStorage.getItem('bgSyncTime'))) / 1000) + 's');
</script>
</head>
<body>

<div class="hero-background">
    <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
    <svg class="bg-route" viewBox="0 0 1180 600" preserveAspectRatio="xMidYMid slice">
      <path class="route-line" d="M-40,420 C160,380 220,300 380,340 C540,380 600,260 820,300 C980,330 1040,240 1220,260" fill="none" stroke="#C6B8E3" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="dot dot-a" cx="380" cy="340" r="6" fill="#B9A8DA"/>
      <circle class="dot dot-b" cx="820" cy="300" r="6" fill="#B9A8DA"/>
      <circle class="dot dot-c" cx="1040" cy="240" r="8" fill="#D42759"/>
    </svg>
</div>

<!-- HEADER UNIVERSEL -->
<div class="top-nav-standalone">
    <div class="header-left">
        <a href="map.html" class="brand-row">
            <svg width="38" height="38" viewBox="0 0 400 400" style="flex-shrink:0;">
                <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
                <circle cx="200" cy="150" r="26" fill="#D42759"/>
            </svg>
            <div>
                <div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div>
                <div class="tagline">Following the footsteps of your favorite artists</div>
            </div>
        </a>
    </div>
    <div class="header-right">
        <div class="dropdown-container">
            <button id="lang-btn" class="header-icon-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></button>
            <div id="lang-menu" class="dropdown-menu hidden">
                <a href="#" class="dropdown-option">English</a>
                <a href="#" class="dropdown-option">Français</a>
            </div>
        </div>
        <div class="dropdown-container">
            <button class="header-icon-btn" onclick="window.location.href='map.html';"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
        </div>
        <div class="dropdown-container">
            <button id="profile-btn" class="header-icon-btn user-avatar-btn">U</button>
            <div id="profile-menu" class="dropdown-menu hidden">
                <a href="map-destinations.html" class="dropdown-option">Explore Destinations</a>
                <a href="map-artists.html" class="dropdown-option">Explore Artists</a>
                <div class="dropdown-divider"></div>
                <a href="account.html" class="dropdown-option">Your Account</a>
                <a href="visited.html" class="dropdown-option">My Visited Places</a>
                <a href="wishlist.html" class="dropdown-option" style="color: #D42759; font-weight: bold;">My Wishlist</a>
                <a href="trips.html" class="dropdown-option">My Trips</a>
                <a href="settings.html" class="dropdown-option">Settings</a>
                <div class="dropdown-divider"></div>
                <a href="index.html" class="dropdown-option" style="color:#D42759; font-weight:bold;">Logout</a>
            </div>
        </div>
    </div>
</div>

<div class="page">
    <div class="card">
        <a href="map.html" class="back-link">← Back to Map</a>
        <h1 class="pg-title">My Wishlist</h1>
        <div id="wishlist-container"></div>
    </div>
</div>

<script src="script.js"></script>
<script>
    window.addEventListener('load', () => {
        renderWishlist();
    });

    function renderWishlist() {
        const wList = JSON.parse(localStorage.getItem('wishlistLocs') || '[]');
        const container = document.getElementById('wishlist-container');
        
        if (wList.length === 0) {
            container.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:30px 0;">Your wishlist is empty.</p>';
            return;
        }

        let html = '';
        wList.forEach(w => {
            const loc = celebLocations.find(l => l.id == w.id);
            if(loc) {
                html += `
                    <div class="loc-card">
                        <div class="loc-card-thumb" style="background-image:url('${loc.img}');"></div>
                        <div class="loc-card-info">
                            <div class="loc-card-title">${loc.name}</div>
                            <div class="loc-card-meta">${loc.group} · ${loc.city}, ${loc.country}</div>
                        </div>
                        <button class="remove-btn" onclick="removeWishlist(${loc.id})">Remove</button>
                    </div>
                `;
            }
        });
        container.innerHTML = html;
    }

    function removeWishlist(id) {
        let wList = JSON.parse(localStorage.getItem('wishlistLocs') || '[]');
        wList = wList.filter(w => w.id != id);
        localStorage.setItem('wishlistLocs', JSON.stringify(wList));
        renderWishlist();
    }
</script>
</body>
</html>
