<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Screen To Street</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #cbd5e1; }
        h1 { color: #334e68; text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 30px;}
        .setting-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #f1f5f9; }
        .setting-item strong { font-size: 1.05rem; color: #334e68; }
        .setting-item span { color: #64748b; font-size: 0.9rem; }
        
        .action-btn { background: #e2e8f0; color: #475569; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        .action-btn:hover { background: #cbd5e1; }
        .danger-btn { background: #ef4444; color: white; border: none; padding: 12px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 30px; width: 100%;}
        
        a.back-btn { display: inline-block; margin-bottom: 20px; color: #D94680; text-decoration: none; font-weight: bold; }
        a.back-btn:hover { text-decoration: underline; }

        /* Style Menu Déroulant Langue */
        select { padding: 8px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; color: #334e68; outline: none; background: #f8fafc; font-weight: bold; cursor: pointer;}

        /* Style Toggle Button Violet */
        .switch { position: relative; display: inline-block; width: 54px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 22px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #8b5cf6; } /* Violet */
        input:checked + .slider:before { 
            transform: translateX(24px); 
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%238b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>'); 
            background-size: 14px; 
            background-repeat: no-repeat; 
            background-position: center; 
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="map.html" class="back-btn">← Back to Map</a>
        <h1>Settings</h1>
        
        <div class="setting-item">
            <strong>Language</strong>
            <select id="lang-select" onchange="changeLanguage(this.value)">
                <option value="en">English</option>
                <option value="fr">Français</option>
            </select>
        </div>
        
        <div class="setting-item">
            <strong>Email Notifications</strong>
            <label class="switch">
                <input type="checkbox" id="notif-toggle" checked>
                <span class="slider"></span>
            </label>
        </div>

        <div class="setting-item">
            <strong>Cookie Preferences</strong>
            <button class="action-btn" onclick="resetCookies()">Reset Banners</button>
        </div>

        <button class="danger-btn" onclick="alert('Are you sure? This action cannot be undone.')">Delete Account</button>
    </div>

    <script>
        // Init language
        const currentLang = localStorage.getItem('lang') || 'en';
        document.getElementById('lang-select').value = currentLang;

        function changeLanguage(val) {
            localStorage.setItem('lang', val);
            // Recharge la page pour que la modif soit prise en compte si on traduit le reste
            window.location.reload();
        }

        function resetCookies() {
            localStorage.removeItem('cookiesAccepted');
            alert('Cookie banner has been reset. It will appear on the map.');
        }
    </script>
</body>
</html>
