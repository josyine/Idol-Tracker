<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celeb Map Explorer - BTS Prototype</title>
    
    <!-- Leaflet CSS (Interactive map library) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Your custom CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main application container -->
    <div class="app-container">
        
        <!-- Sidebar (Filters and Location list) -->
        <aside class="sidebar">
            <h1>🌸 Celeb Map Explorer</h1>
            <p class="subtitle">Following the footsteps of your favorite artists</p>
            
            <div class="filters">
                <button class="filter-btn active">All</button>
                <button class="filter-btn">Run BTS</button>
                <button class="filter-btn">Museums</button>
                <button class="filter-btn">Concerts</button>
            </div>

            <!-- The location list will be injected here automatically via JavaScript -->
            <div class="location-list" id="location-list"></div>
        </aside>

        <!-- Map display area -->
        <main class="map-container">
            <div id="map"></div>
        </main>
        
    </div>

    <!-- Modal Window for full location details (Hidden by default) -->
    <div id="details-modal" class="modal hidden">
        <div class="modal-content">
            <!-- Close button -->
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <!-- Modal Header (Title) -->
            <h2 id="modal-title">Location Name</h2>
            <div id="modal-tags" class="modal-tags"></div>
            
            <!-- NEW: Key information list -->
            <ul class="modal-metadata">
                <li><strong>Members:</strong> <span id="modal-member"></span></li>
                <li><strong>Country:</strong> <span id="modal-country"></span></li>
                <li><strong>City:</strong> <span id="modal-city"></span></li>
                <li><strong>Address:</strong> <span id="modal-full-address"></span></li>
                <li><strong>Date:</strong> <span id="modal-date"></span></li>
                <li id="modal-episode-container"><strong>Episode:</strong> <span id="modal-episode"></span></li>
            </ul>
            
            <!-- Scrolling local images gallery -->
            <div class="modal-gallery" id="modal-gallery">
                <!-- Images (Camptong1.jpg, Camptong2.jpg...) will appear here -->
            </div>
            
            <!-- Detailed information section -->
            <div class="modal-info">
                <h3>📖 The story of this place</h3>
                <p id="modal-desc"></p>
                
                <h3>🚶 How to get there</h3>
                <p id="modal-directions"></p>
                <p id="modal-address" style="color: #6B7280; font-size: 0.9rem; margin-top: 5px;"></p>
                
                <!-- Google Maps redirection button -->
                <a id="modal-map-link" href="#" target="_blank" class="action-btn">🗺️ Open in Google Maps</a>
            </div>
        </div>
    </div>

    <!-- Leaflet JS (Interactive map library) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Your custom JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
