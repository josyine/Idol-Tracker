<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idol</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <h1>Screen To Street</h1>
            <p class="subtitle">Following the footsteps of your favorite artists</p>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search a location, city, context...">
            </div>
            
            <!-- Filters Section -->
            <div class="filters-container">
                <div class="filter-group">
                    <label for="group-select">Group</label>
                    <select id="group-select" class="filter-select">
                        <option value="All">All Groups</option>
                        <option value="BTS">BTS</option>
                        <option value="Blackpink">Blackpink</option>
                        <option value="Twice">Twice</option>
                        <option value="Seventeen">Seventeen</option>
                        <option value="Katseye">Katseye</option>
                        <option value="TXT">TXT</option>
                        <option value="Enhypen">Enhypen</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="member-select">Member</label>
                    <select id="member-select" class="filter-select">
                        <option value="All">All Members</option>
                    </select>
                </div>

                <!-- Filtre de Zone / Pays -->
                <div class="filter-group">
                    <label for="country-select">Area</label>
                    <select id="country-select" class="filter-select">
                        <option value="All">All Areas</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="year-select">Year</label>
                    <select id="year-select" class="filter-select">
                        <option value="All">All Years</option>
                        <option value="2023">2023</option>
                        <option value="2022">2022</option>
                        <option value="2021">2021</option>
                        <option value="2020">2020</option>
                        <option value="2019">2019</option>
                        <option value="2018">2018</option>
                    </select>
                </div>
            </div>

            <!-- Dynamic Category Buttons -->
            <div class="category-filter-section">
                <label>Categories</label>
                <div id="category-buttons" class="category-buttons">
                    <!-- Buttons injected via JS -->
                </div>
            </div>

            <!-- Location list header -->
            <div class="locations-header">
                <label>Locations (<span id="location-count-sidebar">0</span>)</label>
            </div>
            
            <!-- Location list -->
            <div class="location-list" id="location-list"></div>
        </aside>

        <!-- Map Area -->
        <main class="map-container">
            <!-- Elegant Map Stats Overlay -->
            <div class="map-stats">
                <div class="stat-item">
                    <span id="stat-locations">0</span> Locations
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span id="stat-countries">0</span> Countries
                </div>
            </div>
            <div id="map"></div>
        </main>
    </div>

    <!-- Modal Window (Details) -->
    <div id="details-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <h2 id="modal-title">Location Name</h2>
            <div id="modal-tags" class="modal-tags"></div>
            
            <ul class="modal-metadata">
                <li><strong>Group:</strong> <span id="modal-group"></span></li>
                <li><strong>Members:</strong> <span id="modal-member"></span></li>
                <li><strong>Country:</strong> <span id="modal-country"></span></li>
                <li><strong>City:</strong> <span id="modal-city"></span></li>
                <li><strong>Address:</strong> <span id="modal-full-address"></span></li>
                <li><strong>Date:</strong> <span id="modal-date"></span></li>
                <li id="modal-episode-container"><strong>Episode:</strong> <span id="modal-episode"></span></li>
                <li id="modal-link-container"><strong>Watch:</strong> <a id="modal-episode-link" href="#" target="_blank">Watch Episode</a></li>
            </ul>
            
            <!-- Lecteurs Vidéos Embed Multiples (Caché par défaut via CSS) -->
            <div id="modal-video-container" class="modal-videos"></div>

            <!-- Galerie d'images -->
            <div class="modal-gallery" id="modal-gallery"></div>
            
            <div class="modal-info">
                <h3>The story of this place</h3>
                <p id="modal-desc"></p>
                
                <h3>How to get there</h3>
                <p id="modal-directions"></p>
                <p id="modal-address" style="color: #6B7280; font-size: 0.9rem; margin-top: 5px;"></p>
                
                <a id="modal-map-link" href="#" target="_blank" class="action-btn">Open in Google Maps</a>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
