<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Account - Screen To Street</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body, html { margin: 0; padding: 0; height: 100%; overflow-y: auto; background: #fdfbfb; }

  /* FOND ANIMÉ */
  .hero-background { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; overflow: hidden; pointer-events: none; background: linear-gradient(135deg, #F5F3FC, #E3DEF5, #D8CFF0, #E3DEF5); background-size: 200% 200%; animation: gradientShift 10s ease infinite; }
  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; animation: float 12s infinite ease-in-out alternate; }
  .blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: #e3d5f8; }
  .blob-2 { bottom: -10%; right: -10%; width: 35vw; height: 35vw; background: #fce7f0; animation-delay: -4s; }
  .blob-3 { top: 40%; left: 60%; width: 25vw; height: 25vw; background: #d9cdee; animation-delay: -8s; }
  .bg-route { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.5; }
  .route-line { stroke-dasharray: 1 12; animation: flow 14s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -260; } }
  .dot { transform-box: fill-box; transform-origin: center; }
  .dot-a { animation: floatA 3.2s ease-in-out infinite; }
  .dot-b { animation: floatB 3.6s ease-in-out infinite; animation-delay: .4s; }
  .dot-c { animation: floatC 2.8s ease-in-out infinite; animation-delay: .7s; }
  .dot-d { animation: floatD 4s ease-in-out infinite; animation-delay: .2s; }
  .dot-e { animation: floatA 3.4s ease-in-out infinite; animation-delay: 1s; }
  .dot-f { animation: floatB 3s ease-in-out infinite; animation-delay: .5s; }
  .dot-g { animation: floatC 3.8s ease-in-out infinite; animation-delay: 1.3s; }
  @keyframes floatA{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(16px,-20px);} }
  @keyframes floatB{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-18px,18px);} }
  @keyframes floatC{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(14px,16px) scale(1.35);} }
  @keyframes floatD{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-20px,-14px) scale(.75);} }
  @keyframes float { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(30px) scale(1.05); } }

  /* HEADER */
  .top-nav-standalone { position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 2000; background: transparent; }
  .brand-row { text-decoration: none; display: flex; align-items: center; cursor: pointer; gap: 12px; }
  .brand-text { font-size: 19px; font-weight: 700; color: #2E3644; line-height: 1.2; }
  .tagline { font-size: 12px; color: #5B6472; margin-top: 3px; line-height: 1.3;}
  
  .header-actions { display: flex; align-items: center; gap: 14px; }
  .dropdown-container { position: relative; display: inline-block; }
  .header-icon-btn { width: 42px; height: 42px; border-radius: 50%; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #2E3644; border: 1px solid #cbd5e1; cursor: pointer; transition: 0.2s; font-size: 16px; font-weight: bold; box-shadow: 0 4px 14px rgba(80,60,120,.05); }
  .header-icon-btn:hover { background: #FCE7F0; border-color: #fbcfe8; color: #D42759; transform: translateY(-2px);}
  .user-avatar-btn { color: #000000 !important; overflow: hidden; padding: 0;}

  .dropdown-menu { position: absolute; right: 0; top: 52px; background: white; border: 1px solid #cbd5e1; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); min-width: 190px; padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 3000; }
  .dropdown-option { padding: 10px 14px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1e293b; transition: 0.2s; border-radius: 8px; display: block; text-align: left; text-decoration: none;}
  .dropdown-option:hover { background: #f1f5f9; color: #D42759; }
  .dropdown-divider { height: 1px; background-color: #e2e8f0; margin: 4px 8px; }

  /* CONTENEUR PRINCIPAL */
  .standalone-container { padding-top: 120px; padding-bottom: 50px; max-width: 600px; margin: 0 auto; position: relative; z-index: 10; width: 90%; }
  .glass-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.6); border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(80,60,120,.05); }
  
  .page-title { color: #D42759; margin-bottom: 30px; font-size: 28px; font-weight: 700; border-bottom: 2px solid #FCE7F0; padding-bottom: 15px; text-align: center;}
  .back-btn { display: inline-block; margin-bottom: 20px; color: #D42759; text-decoration: none; font-weight: bold; font-size: 13.5px; }
  .back-btn:hover { text-decoration: underline; }

  /* ÉLÉMENTS ACCOUNT */
  .profile-pic-container { text-align: center; margin-bottom: 30px; }
  .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #D42759; margin-bottom: 10px; background: #e2e8f0; display: inline-flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #D42759; font-weight: bold; }
  .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; color: #D42759; font-weight: bold; font-size: 0.9rem;}
  .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
  
  .info-group { margin-bottom: 20px; }
  .info-group label { display: block; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 5px; }
  .info-group input { width: 100%; font-size: 1.1rem; font-weight: 600; margin: 0; padding: 12px; border-radius: 8px; outline: none; transition: 0.3s; }
  
  .input-readonly { background: #f1f5f9; border: 1px solid transparent; color: #64748b; cursor: default; }
  .input-editable { background: #ffffff; border: 2px solid #D42759; color: #1e293b; box-shadow: 0 0 8px rgba(212,39,89,0.2); }
  
  .action-btn-acc { background: #e2e8f0; color: #475569; border: none; padding: 12px 20px; border-radius: 100px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; transition: 0.3s; font-size: 13.5px;}
  .action-btn-acc.edit-mode { background: #D42759; color: white; box-shadow: 0 8px 18px rgba(212,39,89,.22); }
  .action-btn-acc.saved-mode { background: #10b981; color: white; box-shadow: 0 8px 18px rgba(16,185,129,.22); }
</style>
<script>
    if (!sessionStorage.getItem('bgSyncTime')) { sessionStorage.setItem('bgSyncTime', Date.now()); }
    const elapsed = (Date.now() - parseInt(sessionStorage.getItem('bgSyncTime'))) / 1000;
    document.documentElement.style.setProperty('--sync-t', elapsed + 's');
</script>
</head>
<body>

<div class="hero-background">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <svg class="bg-route" viewBox="0 0 1180 600" preserveAspectRatio="xMidYMid slice">
      <path class="route-line" d="M-40,420 C160,380 220,300 380,340 C540,380 600,260 820,300 C980,330 1040,240 1220,260" fill="none" stroke="#C6B8E3" stroke-width="2.5" stroke-linecap="round"/>
      <circle class="dot dot-a" cx="380" cy="340" r="6" fill="#B9A8DA"/>
      <circle class="dot dot-b" cx="820" cy="300" r="6" fill="#B9A8DA"/>
      <circle class="dot dot-c" cx="1040" cy="240" r="8" fill="#D42759"/>
      <circle class="dot dot-d" cx="420" cy="150" r="5" fill="#C6B8E3"/>
      <circle class="dot dot-e" cx="840" cy="140" r="6" fill="#B9A8DA"/>
      <circle class="dot dot-f" cx="150" cy="240" r="5" fill="#D9CDEE"/>
      <circle class="dot dot-g" cx="640" cy="380" r="7" fill="#D42759"/>
    </svg>
</div>

<div class="top-nav-standalone">
    <a href="map.html" class="brand-row">
        <svg width="34" height="34" viewBox="0 0 400 400" style="flex-shrink:0;">
            <path d="M200,50 C148,50 106,92 106,146 C106,220 200,340 200,340 C200,340 294,220 294,146 C294,92 252,50 200,50 Z" fill="#2E3644"/>
            <circle cx="200" cy="150" r="26" fill="#D42759"/>
        </svg>
        <div>
            <div class="brand-text">Screen To <b style="color: #D42759;">Street</b></div>
            <div class="tagline" data-i18n="subtitle">Following the footsteps of your favorite artists</div>
        </div>
    </a>
    
    <div class="header-actions">
        <div class="dropdown-container">
            <button id="lang-btn" class="header-icon-btn" title="Langue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            </button>
            <div id="lang-menu" class="dropdown-menu hidden">
                <a href="#" class="dropdown-option lang-option" data-lang="en">English</a>
                <a href="#" class="dropdown-option lang-option" data-lang="fr">Français</a>
            </div>
        </div>
        <div class="dropdown-container">
            <button class="header-icon-btn" onclick="window.location.href='map.html';">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            </button>
        </div>
        <div class="dropdown-container">
            <button id="profile-btn" class="header-icon-btn user-avatar-btn">U</button>
            <div id="profile-menu" class="dropdown-menu hidden">
                <a href="map-destinations.html" class="dropdown-option" data-i18n="exploreDestOption">Explore Destinations</a>
                <a href="map-artists.html" class="dropdown-option" data-i18n="exploreArtistsOption">Explore Artists</a>
                <div class="dropdown-divider"></div>
                <a href="account.html" class="dropdown-option" data-i18n="accountOption" style="color: #D42759; font-weight: bold;">Your Account</a>
                <a href="visited.html" class="dropdown-option" data-i18n="visitedOption">My Visited Places</a>
                <a href="wishlist.html" class="dropdown-option" data-i18n="wishlistOption">My Wishlist</a>
                <a href="trips.html" class="dropdown-option" data-i18n="tripsOption">My Trips</a>
                <a href="settings.html" class="dropdown-option" data-i18n="settingsOption">Settings</a>
                <div class="dropdown-divider"></div>
                <a href="index.html" class="dropdown-option" id="logout-btn" style="color:#D42759; font-weight:bold;" data-i18n="logoutOption">Logout</a>
            </div>
        </div>
    </div>
</div>

<div class="standalone-container">
    <div class="glass-card">
        <a href="map.html" class="back-btn">← Back to Map</a>
        <h1 class="page-title" data-i18n="accountOption">Your Account</h1>
        
        <div class="profile-pic-container">
            <div id="profile-preview" class="profile-img"></div>
            <div>
                <div class="upload-btn-wrapper">
                    <span>Change Profile Picture</span>
                    <input type="file" id="upload-pic" accept="image/*">
                </div>
            </div>
        </div>
        
        <div class="info-group">
            <label>Name</label>
            <input type="text" id="user-name-input" class="input-readonly" readonly>
        </div>
        
        <div class="info-group">
            <label>Email Address</label>
            <input type="email" id="user-email-input" class="input-readonly" readonly style="cursor: not-allowed;" title="Email cannot be changed">
        </div>

        <div class="info-group">
            <label>Unlocked Passes (Groups)</label>
            <p id="unlocked-passes" style="margin: 0; padding: 12px; background: rgba(255,255,255,0.6); border-radius: 8px; border: 1px solid #cbd5e1; font-weight:600; color: #334155;">Loading...</p>
        </div>

        <button id="toggle-action-btn" class="action-btn-acc" onclick="toggleEditMode()">Edit Profile</button>
    </div>
</div>

<script src="script.js"></script>
<script>
    // Logique spécifique à la page account (en plus de script.js)
    const savedName = localStorage.getItem('userName') || 'Jane Doe';
    const savedEmail = localStorage.getItem('userEmail') || 'jane.doe@example.com';
    const savedPic = localStorage.getItem('userPhoto');

    const nameInput = document.getElementById('user-name-input');
    const emailInput = document.getElementById('user-email-input');
    const profilePreview = document.getElementById('profile-preview');
    const actionBtn = document.getElementById('toggle-action-btn');

    nameInput.value = savedName;
    emailInput.value = savedEmail;

    if(savedPic) {
        profilePreview.style.backgroundImage = `url(${savedPic})`;
        profilePreview.textContent = '';
    } else {
        profilePreview.textContent = savedName.charAt(0).toUpperCase();
    }

    const unlocked = localStorage.getItem('unlockedGroups');
    if(unlocked && unlocked !== '[]') {
        const groups = JSON.parse(unlocked);
        document.getElementById('unlocked-passes').textContent = groups.join(', ');
    } else {
        document.getElementById('unlocked-passes').textContent = 'No active passes.';
    }

    document.getElementById('upload-pic').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                profilePreview.style.backgroundImage = `url(${event.target.result})`;
                profilePreview.textContent = '';
                localStorage.setItem('userPhoto', event.target.result);
                // Mettre à jour l'avatar du header
                document.querySelectorAll('.user-avatar-btn').forEach(btn => {
                    btn.innerHTML = `<img src="${event.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
                });
            }
            reader.readAsDataURL(file);
        }
    });

    let isEditing = false;
    function toggleEditMode() {
        if(!isEditing) {
            isEditing = true;
            nameInput.removeAttribute('readonly');
            nameInput.classList.remove('input-readonly');
            nameInput.classList.add('input-editable');
            nameInput.focus();
            
            actionBtn.textContent = 'Save Changes';
            actionBtn.classList.add('edit-mode');
        } else {
            isEditing = false;
            nameInput.setAttribute('readonly', true);
            nameInput.classList.remove('input-editable');
            nameInput.classList.add('input-readonly');
            
            localStorage.setItem('userName', nameInput.value);
            
            if(!localStorage.getItem('userPhoto')) {
                profilePreview.textContent = nameInput.value.charAt(0).toUpperCase();
                document.querySelectorAll('.user-avatar-btn').forEach(btn => {
                    btn.textContent = nameInput.value.charAt(0).toUpperCase();
                });
            }

            actionBtn.classList.remove('edit-mode');
            actionBtn.classList.add('saved-mode');
            actionBtn.textContent = '✓ Saved Successfully';
            
            setTimeout(() => {
                actionBtn.classList.remove('saved-mode');
                actionBtn.textContent = 'Edit Profile';
            }, 2000);
        }
    }
</script>
</body>
</html>
