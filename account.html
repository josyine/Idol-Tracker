<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Account - Screen To Street</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; background-color: #FDF8F9; color: #374151; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 15px rgba(217, 70, 128, 0.05); border: 1px solid #F5D0DF; }
        h1 { color: #D94680; text-align: center; border-bottom: 2px solid #FCE7F0; padding-bottom: 15px; margin-bottom: 30px;}
        .profile-pic-container { text-align: center; margin-bottom: 30px; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #D94680; margin-bottom: 10px; background: #e2e8f0; display: inline-block; }
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; cursor: pointer; color: #D94680; font-weight: bold; font-size: 0.9rem;}
        .upload-btn-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; }
        .info-group { margin-bottom: 20px; }
        .info-group label { display: block; font-size: 0.8rem; text-transform: uppercase; color: #9CA3AF; font-weight: bold; margin-bottom: 5px; }
        .info-group input { width: 100%; font-size: 1.1rem; font-weight: 600; margin: 0; padding: 12px; background: #FDF8F9; border-radius: 8px; border: 1px solid #F5D0DF; outline: none;}
        .info-group input:focus { border-color: #D94680; }
        .save-btn { background: #D94680; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;}
        .save-btn:hover { background: #bd336b; }
        a.back-btn { display: inline-block; margin-bottom: 20px; color: #D94680; text-decoration: none; font-weight: bold; }
        a.back-btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="map.html" class="back-btn">← Back to Map</a>
        <h1 data-i18n="menuAccount">Your Account</h1>
        
        <div class="profile-pic-container">
            <img id="profile-preview" class="profile-img" src="https://via.placeholder.com/100?text=Avatar" alt="Profile">
            <div>
                <div class="upload-btn-wrapper">
                    <span>Change Profile Picture</span>
                    <input type="file" id="upload-pic" accept="image/*">
                </div>
            </div>
        </div>
        
        <div class="info-group">
            <label>Name</label>
            <input type="text" id="user-name-input" value="Jane Doe">
        </div>
        
        <div class="info-group">
            <label>Email Address</label>
            <input type="email" id="user-email-input" value="jane.doe@example.com" readonly style="background: #e9ecef; cursor: not-allowed;">
        </div>

        <div class="info-group">
            <label>Unlocked Passes (Groups)</label>
            <p id="unlocked-passes" style="margin: 0; padding: 12px; background: #FDF8F9; border-radius: 8px; border: 1px solid #F5D0DF; font-weight:600;">Loading...</p>
        </div>

        <button class="save-btn" onclick="saveAccountChanges()">Save Changes</button>
    </div>

    <script>
        // Charger les données sauvegardées
        const savedName = localStorage.getItem('userName');
        const savedEmail = localStorage.getItem('userEmail');
        const savedPic = localStorage.getItem('userProfilePic');

        if(savedName) document.getElementById('user-name-input').value = savedName;
        if(savedEmail) document.getElementById('user-email-input').value = savedEmail;
        if(savedPic) document.getElementById('profile-preview').src = savedPic;

        const unlocked = localStorage.getItem('unlockedGroups');
        if(unlocked) {
            const groups = JSON.parse(unlocked);
            document.getElementById('unlocked-passes').textContent = groups.join(', ');
        } else {
            document.getElementById('unlocked-passes').textContent = 'No active passes.';
        }

        // Gérer l'upload d'image
        document.getElementById('upload-pic').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('profile-preview').src = event.target.result;
                    localStorage.setItem('userProfilePic', event.target.result);
                }
                reader.readAsDataURL(file);
            }
        });

        function saveAccountChanges() {
            const newName = document.getElementById('user-name-input').value;
            localStorage.setItem('userName', newName);
            alert("Changes saved successfully!");
        }
    </script>
</body>
</html>
